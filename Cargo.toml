[package]
name = "iicp-management-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.2"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
base64 = "0.22"
ed25519-dalek = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
iicp-client = { version = "=0.7.108", default-features = false }

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }
tempfile = "3"
