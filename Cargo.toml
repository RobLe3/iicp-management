[package]
name = "iicp-management-core"
version = "0.3.0-rc.1"
edition = "2021"
rust-version = "1.86"
description = "Implementation-neutral policy, planning, controller, and conformance foundation for IICP management"
license = "Apache-2.0"
keywords = ["iicp", "policy", "management", "infrastructure"]
categories = ["command-line-utilities", "config"]
repository = "https://github.com/RobLe3/iicp-management"
documentation = "https://docs.rs/iicp-management-core"
readme = "README.md"
publish = ["crates-io"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
    "SECURITY.md",
    "CHANGELOG.md",
    "COMPATIBILITY.md",
    "CONFORMANCE.md",
    "LOCAL_AUTHORITY.md",
    "contracts/**",
    "docs/**",
    "examples/**",
    "fixtures/**",
    "src/**",
]

[lib]
name = "iicp_management_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.2"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
base64 = "0.22"
ed25519-dalek = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
iicp-client = { version = "=0.7.108", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }
tempfile = "3"
