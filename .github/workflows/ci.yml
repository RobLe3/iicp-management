name: Management Foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check dependency policy before compilation
        run: python3 scripts/check_dependency_policy.py
      - name: Test release-safety contracts
        run: python3 -m unittest scripts/test_dependency_policy.py scripts/test_release_manifest.py scripts/test_release_readiness.py
      - run: cargo fmt --check
      - run: python3 tools/test_public_references.py
      - run: python3 tools/check_public_references.py
      - run: python3 tools/test_management_conformance.py
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo run --locked --bin iicp-management-conformance --quiet

  windows-owner-ipc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --bin iicp-management-controller
      - run: cargo test --locked --test controller_and_adapters
      - run: cargo test --locked --test plan_submission
      - run: cargo test --locked --test apply_gate
